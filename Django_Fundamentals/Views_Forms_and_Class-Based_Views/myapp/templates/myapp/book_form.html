
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Book | BookVerse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6fb;
            color: #20243a;
        }

        header {
            background: linear-gradient(135deg, #312e81, #6d5ce7);
            color: white;
            padding: 25px 8%;
            font-size: 25px;
            font-weight: bold;
        }

        .form-card {
            max-width: 540px;
            margin: 55px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(40, 45, 90, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #73778c;
            margin-bottom: 28px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9dbea;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6d5ce7;
            box-shadow: 0 0 0 3px #ede9fe;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #6d5ce7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #4f46b5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #6d5ce7;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .form-card {
                margin: 25px 16px;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>📚 BookVerse</header>

    <main class="form-card">
        <h1>Add a New Book</h1>
        <p class="subtitle">
            Enter the book details to add it to your collection.
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="save-btn">
                Save Book
            </button>
        </form>

        <a href="{% url 'book_list' %}" class="back-link">
            ← Back to Book Collection
        </a>
    </main>

</body>
</html>
